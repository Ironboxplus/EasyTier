name: MP CI

# Builds and tests for this fork's MP work. A `ci/**` branch is made by the
# development repository's `_tools/ci_push.sh`: its tree is EasyTier, plus
# `.ci/refs.env`, which pins the tquic and netwatcher fork commits that sit
# next to EasyTier (`../vendor/*` path dependencies), and optionally
# `.ci/filter`, a nextest filter expression to run instead of every test.
#
# One job builds a nextest archive once; many jobs then each run a hash
# partition of it, as root (the netns and TUN tests need it), in parallel.

on:
  push:
    branches: ["ci/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SHARDS: 16

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tquic_ref: ${{ steps.refs.outputs.tquic_ref }}
      netwatcher_ref: ${{ steps.refs.outputs.netwatcher_ref }}
      filter: ${{ steps.refs.outputs.filter }}
      shards: ${{ steps.refs.outputs.shards }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .ci
      - id: refs
        run: |
          source .ci/refs.env
          echo "tquic_ref=$TQUIC_REF" >> "$GITHUB_OUTPUT"
          echo "netwatcher_ref=$NETWATCHER_REF" >> "$GITHUB_OUTPUT"
          filter="all()"
          [ -s .ci/filter ] && filter="$(cat .ci/filter)"
          echo "filter=$filter" >> "$GITHUB_OUTPUT"
          echo "shards=$(seq -s, 1 "$SHARDS" | sed 's/^/[/;s/$/]/')" >> "$GITHUB_OUTPUT"
          echo "tquic $TQUIC_REF, netwatcher $NETWATCHER_REF, filter: $filter"

  build:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: et
      - uses: actions/checkout@v5
        with:
          repository: Ironboxplus/tquic
          ref: ${{ needs.plan.outputs.tquic_ref }}
          path: vendor/tquic
          submodules: recursive
      - uses: actions/checkout@v5
        with:
          repository: Ironboxplus/netwatcher
          ref: ${{ needs.plan.outputs.netwatcher_ref }}
          path: vendor/netwatcher
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -qqy build-essential mold musl-tools cmake clang libssl-dev pkg-config
          mkdir -p et/easytier-gui/dist
      - uses: arduino/setup-protoc@v3
        with:
          version: "35.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.95"
          cache: false
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: et -> target
      - uses: taiki-e/install-action@nextest
      # Default features plus mpquic (which brings aes-gcm): `full` without
      # openssl-crypto. Vendored OpenSSL and TQUIC's static BoringSSL export
      # the same C symbols, and OpenSSL ChaCha20 then crashes (SIGSEGV); no
      # shipped build enables openssl-crypto.
      - name: Build test archive
        working-directory: et
        run: cargo nextest archive --archive-file ../tests.tar.zst --package easytier --features mpquic
      # Handed to the test jobs through the Actions cache, not as an
      # artifact: artifacts count against the account's 500 MB storage, the
      # cache does not. `result` deletes the entry when the run is done.
      - uses: actions/cache/save@v4
        with:
          path: tests.tar.zst
          key: tests-${{ github.run_id }}-${{ github.run_attempt }}

  test:
    name: test (${{ matrix.shard }}/16)
    needs: [plan, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: et
      - name: Prepare system for tests
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -qqy bridge-utils miniupnpd miniupnpd-iptables iptables
          sudo modprobe br_netfilter
          sudo sysctl net.bridge.bridge-nf-call-iptables=0
          sudo sysctl net.bridge.bridge-nf-call-ip6tables=0
          sudo sysctl net.ipv6.conf.lo.disable_ipv6=0
          sudo ip addr add 2001:db8::2/64 dev lo
      - uses: taiki-e/install-action@nextest
      - uses: actions/cache/restore@v4
        with:
          path: tests.tar.zst
          key: tests-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Run partition ${{ matrix.shard }}
        run: |
          sudo prlimit --pid $$ --nofile=1048576:1048576
          sudo -E env "PATH=$PATH" cargo nextest run \
            --archive-file tests.tar.zst \
            --workspace-remap "$GITHUB_WORKSPACE/et" \
            --partition "hash:${{ matrix.shard }}/$SHARDS" \
            -E '${{ needs.plan.outputs.filter }}' \
            --test-threads 1 --no-fail-fast --no-tests pass

  tquic:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Ironboxplus/tquic
          ref: ${{ needs.plan.outputs.tquic_ref }}
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -qqy cmake clang
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.95"
          cache: false
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --lib

  frontend:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/setup-protoc@v3
        with:
          version: "35.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # pnpm first: setup-node caches the pnpm store and looks for pnpm. Its
      # version is package.json's packageManager.
      - uses: pnpm/action-setup@v5
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm -r install
      - run: pnpm -C easytier-web/frontend-lib test:config-ui

  # The arm64 APK, as upstream mobile.yml builds it, signed with the repo's
  # upload keystore (the key the installed app was signed with). TQUIC builds
  # BoringSSL with the NDK's CMake toolchain (ANDROID_NDK_HOME), and bindgen
  # needs the NDK sysroot or it parses the host's /usr/include.
  android:
    needs: plan
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 26.0.10792818
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
    steps:
      - uses: actions/checkout@v5
        with:
          path: et
      - uses: actions/checkout@v5
        with:
          repository: Ironboxplus/tquic
          ref: ${{ needs.plan.outputs.tquic_ref }}
          path: vendor/tquic
          submodules: recursive
      - uses: actions/checkout@v5
        with:
          repository: Ironboxplus/netwatcher
          ref: ${{ needs.plan.outputs.netwatcher_ref }}
          path: vendor/netwatcher
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12.0
          packages: "build-tools;34.0.0 ndk;26.0.10792818 platform-tools platforms;android-34"
      - name: Android environment
        run: |
          ndk=$ANDROID_HOME/ndk/$NDK_VERSION
          llvm=$ndk/toolchains/llvm/prebuilt/linux-x86_64
          echo "$llvm/bin" >> "$GITHUB_PATH"
          {
            echo "NDK_HOME=$ndk"
            echo "ANDROID_NDK_HOME=$ndk"
            echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--sysroot=$llvm/sysroot"
          } >> "$GITHUB_ENV"
          sudo apt-get update && sudo apt-get install -qqy cmake
      - uses: arduino/setup-protoc@v3
        with:
          version: "35.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.95"
          target: aarch64-linux-android
          cache: false
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: et -> target
          key: android
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: et/package.json
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: et/pnpm-lock.yaml
      - name: Build frontend packages
        working-directory: et
        run: |
          pnpm -r install
          pnpm -r --workspace-concurrency=1 build
      - name: Build APK
        working-directory: et/easytier-gui
        run: pnpm tauri android build --ci --apk --target aarch64 --split-per-abi
      - name: Check signature and collect
        run: |
          mkdir -p apk
          find et/easytier-gui/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -exec mv -t apk {} +
          for apk in apk/*.apk; do
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk" | head -4
          done
          sha256sum apk/*.apk
      - uses: actions/upload-artifact@v5
        with:
          name: android-arm64
          path: apk/*.apk
          retention-days: 1

  # The Windows release binaries that get deployed: easytier-gui.exe (as
  # upstream gui.yml builds it, without the installer) and easytier-cli.exe
  # (the features the .99 release script used). Full release profile.
  windows:
    needs: plan
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        part: [gui, cli]
    steps:
      - uses: actions/checkout@v5
        with:
          path: et
      - uses: actions/checkout@v5
        with:
          repository: Ironboxplus/tquic
          ref: ${{ needs.plan.outputs.tquic_ref }}
          path: vendor/tquic
          submodules: recursive
      - uses: actions/checkout@v5
        with:
          repository: Ironboxplus/netwatcher
          ref: ${{ needs.plan.outputs.netwatcher_ref }}
          path: vendor/netwatcher
      - uses: arduino/setup-protoc@v3
        with:
          version: "35.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ilammy/setup-nasm@v1
      # TQUIC builds BoringSSL with CMake. The cmake crate cannot name a
      # Visual Studio generator for this runner's VS; Ninja in the MSVC
      # developer environment (what vcvars64.bat gave the .99 builds) can.
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - run: echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
      # The steps run in Git Bash, whose /usr/bin/link (coreutils) comes
      # before MSVC's link.exe on PATH: name MSVC's linker for cargo.
      - name: Use MSVC's link.exe
        shell: pwsh
        run: |
          $link = (Get-Command link.exe -All | Where-Object { $_.Source -like '*\MSVC\*' } | Select-Object -First 1).Source
          if (-not $link) { throw 'MSVC link.exe not found' }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$link" >> $env:GITHUB_ENV
          "linker: $link"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.95"
          cache: false
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: et -> target
          key: windows-${{ matrix.part }}
      - name: Build easytier-cli
        if: matrix.part == 'cli'
        working-directory: et
        run: cargo build --locked --release -p easytier --features mpquic,faketcp,mimalloc --bin easytier-cli
      - uses: pnpm/action-setup@v5
        if: matrix.part == 'gui'
        with:
          package_json_file: et/package.json
          run_install: false
      - uses: actions/setup-node@v5
        if: matrix.part == 'gui'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: et/pnpm-lock.yaml
      - name: Build easytier-gui
        if: matrix.part == 'gui'
        working-directory: et
        run: |
          find easytier/third_party/x86_64 -maxdepth 1 -type f \( -name '*.dll' -o -name '*.sys' \) -exec cp {} easytier-gui/src-tauri/ \;
          pnpm -r install
          # tauri's beforeBuildCommand builds frontend-lib and the GUI front
          # end; only the vpnservice plugin's dist-js is left. Its rollup on
          # Windows has been seen to write the files and never exit.
          timeout 300 pnpm --filter tauri-plugin-vpnservice-api build || test -f tauri-plugin-vpnservice/dist-js/index.js
          cd easytier-gui
          pnpm tauri build --no-bundle
      - name: Collect
        run: |
          mkdir out
          if [ "${{ matrix.part }}" = gui ]; then cp et/target/release/easytier-gui.exe out/; else cp et/target/release/easytier-cli.exe out/; fi
          sha256sum out/*
      - uses: actions/upload-artifact@v5
        with:
          name: windows-${{ matrix.part }}
          path: out/*
          retention-days: 1

  result:
    needs: [build, test, tquic, frontend, android, windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete this run's test archive from the cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache delete "tests-${{ github.run_id }}-${{ github.run_attempt }}" -R "$GITHUB_REPOSITORY" || true
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
