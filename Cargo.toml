[workspace]
resolver = "2"
members = [
    "cake-sqm",
    "easytier",
    "easytier-gui/src-tauri",
    "easytier-web",
    "easytier-contrib/easytier-ffi",
    "easytier-contrib/easytier-uptime",
    "easytier-contrib/easytier-android-jni",
]
default-members = ["easytier", "easytier-web"]
exclude = [
    "easytier-contrib/easytier-ohrs", # it needs ohrs sdk
]

[workspace.package]
edition = "2024"
rust-version = "1.95"

[profile.dev]
panic = "unwind"
debug = 2

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3
strip = true
# Reuse the front-end work (parsing, type and borrow checking, MIR) of
# unchanged code across builds; Cargo turns this off for release by default.
incremental = true
