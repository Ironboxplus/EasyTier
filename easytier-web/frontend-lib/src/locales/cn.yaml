    reliable_stream: 每流一条可靠流
  mode_help:
    datagram: RFC 默认，隧道不重发丢失的包。
    reliable_stream: 每条流一个 QUIC 流；不丢包、流内有序、流之间互不阻塞。
  rules_label: 分类规则
