    max_datagram_help: QUIC 根据当前路径 MTU 算出的单个数据报能携带的最大字节数。
    recommended_mtu: 建议的虚拟网卡 MTU
    recommended_mtu_help: 单个数据报最大长度减去数据报头、EasyTier 隧道头、EasyTier 包头和加密校验后的值。虚拟网卡 MTU 不大于它时，每个包都能装进一个数据报，不需要分片或改走可靠流。
    current_mtu: 当前虚拟网卡 MTU
    mtu_ok: 当前 MTU 不大于建议值，每个包都能装进一个数据报，无需修改。
    mtu_too_large: 当前 MTU 大于建议值，超长的包要分片或改走可靠流。
    apply_mtu: 改为 {0}
    apply_mtu_note: 保存到配置，实例重启后生效。
    events_title: 异常计数（累计）
    oversize: 超长包：丢弃未回复 / 回 ICMP
    oversize_help: 装不进一个数据报的包数。前者是丢弃后无法回复发送方的（非 IP 包，或还不知道上限）；后者丢弃并回 ICMP“包太大”，让发送方改小包。
    frag: 分片：发出 / 重组 / 超时
    frag_help: 超长包按“分片”策略拆成多个数据报：发出的分片数、成功重组的包数、因分片丢失而放弃的包数。
    queue_dropped: 数据报发送队列丢弃
    queue_dropped_help: 发送太快、QUIC 来不及发出而丢弃的数据报数。
    breaker: 拥塞保护触发次数
    breaker_help: 开启“数据报不受拥塞窗口约束”后，持续严重丢包时会自动恢复拥塞控制，这里是触发次数。
    classes_title: 按流量类别的发送统计
    total: 累计 {0}
    recycled_help: 因空闲而关闭回收的流数量。
    rx_all: 接收（全部类别）
    rx_help: 收到的包在解密前无法分类，只能统计合计。
    overhead: 隧道开销
    overhead_help: 数据报头 + EasyTier 隧道头 + EasyTier 包头 + 加密校验。
    rx_note: 接收方向无法按类别统计（收到时包仍是加密的），合计接收 {0}，累计 {1}。
    col:
      class: 类别
      mode: 发送方式
      rate: 速率
      tx: 发送速率
      streams: 可靠流数量

mp_plugin:
  congestion_control:
    engine_default:
      name: 默认（BBR）
      description: TQUIC 默认拥塞控制，即 BBR。
    bbr:
      name: BBR v1
      description: 根据测得的带宽和 RTT 控制发送速率，稳定链路上排队短。
    bbr3:
      name: BBR v3
      description: 在 BBR 基础上，探测带宽时同时考虑丢包和 ECN。
    cubic:
      name: CUBIC
      description: 根据丢包调整，传统 TCP 的默认算法。
    copa:
      name: COPA
      description: 根据时延调整，目标是低排队时延。
    brutal:
      name: Brutal（Hysteria）
      description: 不因丢包降速，按速率发送并补偿丢包。速率是 Autorate 测得链路能承受的值，不超过对端下行。
      up_mbps:
        label: 上行（Mbps）
        help: Autorate 估计的起点：链路能多承载且不排队时 Autorate 往上调，排队时往下调，空闲后回到这个值。要限速请设出口限速，不是这里。
      down_mbps:
        label: 下行（Mbps）
        help: 本机的下行带宽，告诉对端往本机发送最多这么快；0 表示不限制。
      disable_loss_compensation:
        label: 不补偿丢包
        help: 默认按丢包率多发（丢 10% 就多发约 11%，最多多发 25%），让送达的速率达到目标；开启后不再多发。
  scheduler:
    min_rtt:
      name: 最低 RTT 优先
      description: 总是用 RTT 最低的路径发送。
    round_robin:
      name: 轮流
      description: 在所有路径上轮流发包。
    redundant:
      name: 冗余
      description: 每条路径都发一份，丢包和时延最低，但不叠加带宽。
    sqm_weighted:
      name: 按剩余带宽分配
      description: 按每条链路的 SQM 剩余带宽分配流量，可在时延和带宽之间调节。
      latency_bandwidth:
        label: 时延 ↔ 带宽
        help: 0 = 集中在时延最低的路径；1 = 分散到所有路径以获得最大总带宽。
