mp_dp:
  section: 按类别选择 QUIC 发送方式（数据报 / 可靠流）
  help: 决定流量在 MPQUIC 会话里怎么传。默认遵循 RFC 9484：所有包都用不可靠的 QUIC 数据报发送，隧道不重传、没有队头阻塞，丢包由里层 TCP/QUIC 自己恢复。
  enabled: 按类别选择 QUIC 发送方式
  enabled_help: 需要两端都支持，否则整条会话回退为单条可靠流。切换此项会重连 MP 会话。
  preset_label: 场景
  preset:
    default: 默认（TCP 与代理走可靠流，其余数据报）
    rfc: RFC（全部数据报）
    custom: 自定义
  preset_help:
    default: 每条 TCP 连接一条独立可靠流（由 QUIC 恢复丢包，TCP 保持速度，连接之间互不阻塞），QUIC/KCP 代理流量同样走可靠流；UDP 和 ICMP 走数据报。
    rfc: 全部走数据报。延迟最低、无队头阻塞，但丢包直接交给应用：TCP 在有丢包的线路上会明显降速。
    custom: 在下方按类别手动设置。
  proxy_note: QUIC/KCP 代理在本机接下每条 TCP 连接，并用独立的可靠流传输（RFC 3135 拆分式代理）；代理自己的包按下方“proxy”类别的模式传输（默认可靠流）。
  oversize_label: 超过一个数据报的包
  oversize:
    icmp_ptb: 丢弃并回 ICMP"包太大"
    fragment: 分片
  oversize_help:
    icmp_ptb: RFC 9484 的做法，发送方 TCP 通过路径 MTU 发现自动改小包。非 IP 包无法回复，直接丢弃。
    fragment: 最多拆成 4 个数据报，任一片丢失则整包丢失。
  stream_max: 可靠流上限
  stream_idle_s: 空闲多久后关闭流
  classes_label: 按类别选择模式
  class:
