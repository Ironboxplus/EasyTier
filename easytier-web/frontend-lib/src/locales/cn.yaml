  ceiling_help: 实际生效的发送限速：Autorate 估计值，不超过配置的限速。还没有估计值、也没有配置限速时为不限速。
  queue_delay: 排队时延
  queue_delay_help: 包在本机发送队列里等待的时间。
  ceiling_source:
    none: 未限速
    static: 全局限速
    per_device: 按网卡限速
    autorate: 按 Autorate 限速
  fallback_scope: 未识别出口网卡
  fallback_scope_help: 无法识别这些路径走哪块网卡，它们共用同一份发送额度。
  paths: 路径数
  cake_title: 发送队列（Linux CAKE）
  cake_hint: 每块网卡（或每条宽带）一个队列，经过它的所有会话共用。它按 Autorate 带宽估计限速，各条流轮流发送，大流量不会拖慢小流量；某条流等待超过目标时延时，主动丢它的包，让发送方降速。
  cake_rate: 限速到
  cake_rate_help: 队列放行包的速率：Autorate 带宽估计值，且不超过配置的上限。
  cake_backlog: 排队
  cake_backlog_help: 此刻在队列里等待的字节数和包数。
  cake_packets: '{0} 个包'
  cake_memory: 包缓存
  cake_memory_help: 排队的包占用的内存 / 上限。超过上限时，从排队最长的那条流的队首丢包，小流量不受影响。
  cake_target: 目标时延 / 观察间隔
  cake_target_help: 某条流的包连续一个观察间隔都等待超过目标时延时，就丢它的包（与 Linux CAKE 相同的 CoDel 和 BLUE 算法）。
  cake_drops_aqm: 为控制时延而丢的包
  cake_drops_aqm_help: 队列因为等待过久而主动丢掉的包数。
  cake_drops_overlimit: 缓存满了丢的包
  cake_drops_overlimit_help: 包缓存已满而丢掉的包数。
  cake_stream_drops_aqm: 可靠流中为控制时延而丢的帧
  cake_stream_drops_aqm_help: TCP 和代理流量走可靠的 QUIC 流。它们的待发队列用同样的办法控制：等待过久的帧被丢掉，内层 TCP 随之降速。
  cake_stream_drops_overlimit: 可靠流队列满了丢的帧
  cake_stream_drops_overlimit_help: 某条流的待发队列超过大小上限而丢掉的帧数。
  cake_delay_peak: 等待时间峰值
  cake_delay_help: 包在队列里等待的时间：近期峰值、平均值和最低值（基线）。
  cake_delay_avg: 平均等待时间
  cake_delay_base: 基线等待时间
  cake_flows: 流数量
  cake_flows_help: 队列中的流：稀疏流（短小，优先发送）/ 大流（长时间传输）/ 不响应流（丢包后不降速）。
  sqm_off_note: SQM 未开启：下方的发送队列仍按 Autorate 带宽估计给网卡限速。开启 SQM 后，数据报默认也不再受 QUIC 拥塞窗口约束。
  decision: 路径选择
  decision_hint: "调度器每 0.5 秒按往返时延从低到高选出最多 kmax 条路径承载数据，其余已验证的路径作为备用。"
