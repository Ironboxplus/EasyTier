    hint: 每个包先按协议分类（TCP、UDP、ICMP 等），再按类别决定用哪种方式通过 QUIC 发送：QUIC 数据报（丢了不重传），或者每条连接一条可靠的 QUIC 流（丢了由 QUIC 重传）。
    negotiated:
      datagram: 使用数据报
      stream_fallback: 对端不支持，改用单条可靠流
