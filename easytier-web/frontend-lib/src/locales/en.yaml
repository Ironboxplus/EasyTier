mp_dp:
  section: QUIC send method per traffic class (datagrams / reliable streams)
  help: How traffic is carried inside the MPQUIC session. Default follows RFC 9484 — every packet as an unreliable QUIC DATAGRAM, no tunnel-level retransmission and no head-of-line blocking; the inner TCP/QUIC recovers its own losses.
  enabled: Choose the QUIC send method per class
  enabled_help: Needs support on both peers; otherwise the session falls back to the single reliable stream. Toggling it reconnects the MP session.
  preset_label: Scenario
  preset:
    default: Default (TCP and proxy on reliable streams, rest datagrams)
    rfc: RFC (all datagrams)
    custom: Custom
  preset_help:
    default: Each TCP connection gets its own reliable stream (QUIC recovers losses so TCP keeps its speed, and connections never block each other), and so does QUIC/KCP proxy traffic; UDP and ICMP ride datagrams.
    rfc: Everything as datagrams. Lowest latency, no head-of-line blocking, but losses go straight to the applications; TCP slows down markedly on a lossy link.
    custom: Per-class modes edited by hand below.
  proxy_note: The QUIC/KCP proxy terminates each TCP connection locally and carries it on its own reliable stream (RFC 3135 split proxy); its packets follow the "proxy" class mode below (reliable stream by default).
  oversize_label: Packets larger than one datagram
  oversize:
    icmp_ptb: Drop + ICMP Packet Too Big
    fragment: Fragment
  oversize_help:
    icmp_ptb: RFC 9484 behaviour; the sender's TCP lowers its packet size via PMTU discovery. Packets that cannot be answered (non-IP) are dropped.
    fragment: Split into up to 4 datagrams; losing any fragment loses the whole packet.
  stream_max: Max reliable streams
  stream_idle_s: Close a stream after idle for
  classes_label: Per-class mode
  class:
    et_control: ET control
    tcp: TCP
    udp: UDP
    icmp: ICMP
    proxy: QUIC/KCP proxy
    other: Other
  mode:
    datagram: Datagram
    reliable_stream: Reliable stream per flow
  mode_help:
    datagram: RFC default. Lost packets are not resent by the tunnel.
    reliable_stream: One QUIC stream per flow; no loss, per-flow order, flows never block each other.
  rules_label: Classification rules
  rules_help: First enabled match wins and puts the packet in the named class, which then gets its own mode above.
  rule_name_placeholder: Class name, e.g. ssh
  rule_ports_placeholder: Ports, e.g. 22 or 27015-27030
  rule_dst_placeholder: Destination CIDR (optional)
  rule_add: Add rule
  rule_name_invalid: Name is empty or already used.
  rule_port_invalid: Port must be N or N-M within 1-65535.
  col:
    class: Class
    mode: Mode
    name: Name
    protocol: Protocol
    ports: Ports
    dst: Destination
    enabled: Enabled
  rt:
    title: Traffic classification and QUIC send method
    hint: Each packet is classified by protocol (TCP, UDP, ICMP, ...), and its class decides how QUIC sends it — as a QUIC datagram (not retransmitted when lost) or on a reliable QUIC stream per connection (QUIC retransmits losses).
    negotiated:
      datagram: using datagrams
      stream_fallback: peer lacks support, single reliable stream
      disabled: off (single reliable stream)
    fallback_reason: Reason
    reason:
      not_built: 'Off: every packet goes over one reliable stream. Turn on "choose the QUIC send method per class" in the network config and reconnect.'
    size_title: Packet size
    max_datagram: Largest datagram
    max_datagram_help: The most bytes one QUIC datagram can carry, from the current path MTU.
    recommended_mtu: Recommended virtual NIC MTU
    recommended_mtu_help: Largest datagram minus the datagram header, EasyTier tunnel header, EasyTier packet header and encryption tag. With the virtual NIC MTU at or below it every packet fits in one datagram, with no fragmenting and no detour over a stream.
    current_mtu: Current virtual NIC MTU
    mtu_ok: The current MTU is not above the recommendation; every packet fits in one datagram. Nothing to change.
    mtu_too_large: The current MTU is above the recommendation; larger packets are fragmented or sent on a reliable stream.
    apply_mtu: Change to {0}
    apply_mtu_note: Saved to the config; takes effect after the instance restarts.
    events_title: Exception counters (cumulative)
    oversize: 'Too large for a datagram: dropped unanswered / answered with ICMP'
    oversize_help: Packets that did not fit one datagram. The first were dropped with no way to tell the sender (not IP, or the limit is not known yet); the second were dropped with an ICMP "packet too big" so the sender uses smaller packets.
    frag: 'Fragments: sent / reassembled / timed out'
    frag_help: With the "fragment" policy, oversize packets are split into several datagrams. Fragments sent, packets reassembled, and packets given up because a fragment was lost.
    queue_dropped: Datagram send queue drops
    queue_dropped_help: Datagrams dropped because they arrived faster than QUIC could send them.
    breaker: Congestion protection trips
    breaker_help: With "datagrams ignore the congestion window" on, sustained heavy loss switches congestion control back on automatically; this counts how often.
    classes_title: Sending per traffic class
    total: total {0}
    recycled_help: Streams closed and recycled after going idle.
    rx_all: Received (all classes)
    rx_help: Received packets cannot be classified before decryption, so only the total is counted.
    overhead: Tunnel overhead
    overhead_help: Datagram header + EasyTier tunnel header + EasyTier packet header + encryption tag.
    rx_note: 'Received traffic cannot be split by class (packets are still encrypted on arrival): {0} now, {1} in total.'
    col:
      class: Class
      mode: Send method
      rate: Rate
      tx: Send rate
      streams: Reliable streams

mp_plugin:
  congestion_control:
    engine_default:
      name: Default (BBR)
      description: TQUIC's default congestion control, which is BBR.
    bbr:
      name: BBR v1
      description: Paces by the measured bandwidth and RTT; keeps queues short on stable links.
    bbr3:
      name: BBR v3
      description: BBR that also reacts to loss and ECN while probing for bandwidth.
    cubic:
      name: CUBIC
      description: Loss-based, the classic TCP default.
    copa:
      name: COPA
      description: Delay-based, aims for low queueing delay.
    brutal:
      name: Brutal (Hysteria)
      description: Does not slow down on loss; sends at a rate and makes up for lost packets. The rate is what Autorate measures the link can take, never above the peer's download.
      up_mbps:
        label: Upload (Mbps)
        help: Autorate's starting point. Autorate raises the rate while the link carries more without queueing, lowers it when the link queues, and returns to this value when idle. A limit on the rate is the egress limit, not this.
      down_mbps:
        label: Download (Mbps)
        help: This machine's download bandwidth, telling the peer to send to it no faster than this; 0 means no limit.
      disable_loss_compensation:
        label: No loss compensation
        help: By default the rate is raised by the loss rate (about 11% more at 10% loss, at most 25% more) so the delivered rate reaches the target; when on, it is not raised.
  scheduler:
    min_rtt:
      name: Lowest RTT first
      description: Always sends on the path with the lowest RTT.
    round_robin:
      name: Round robin
      description: Takes turns across all paths.
    redundant:
      name: Redundant
      description: Sends a copy on every path; lowest loss and delay, but bandwidth does not add up.
    sqm_weighted:
      name: By spare bandwidth
      description: Splits traffic by each link's spare SQM bandwidth, tunable between delay and bandwidth.
      latency_bandwidth:
        label: Delay ↔ bandwidth
        help: 0 = concentrate on the lowest-delay path; 1 = spread over all paths for maximum total bandwidth.
